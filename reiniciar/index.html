<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reiniciar Relicario</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F3EAD8">
  <script>
    // Modo claro u oscuro: el que se elija en Almanaque, común a todos los juegos. Sin elegir, claro.
    try {
      if (localStorage.getItem('almanaque:tema') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]').content = '#1C1712';
      }
    } catch (e) {}
  </script>
  <link rel="icon" href="../icons/favicon.ico" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=3">
</head>
<body>
  <div class="hoja">
    <header class="cabecera">
      <span></span>
      <div class="cabecera__titulo">
        <h1><img class="cabecera__logo" src="../icons/relicario-logo.svg" width="34" height="34" alt="">Relicario</h1>
        <p class="cabecera__sub">Reiniciar el juego</p>
      </div>
      <span></span>
    </header>

    <main>
      <section class="pantalla pantalla--centro" id="pregunta">
        <h2 class="kicker">Vaciar las vitrinas</h2>
        <p>Se borrarán tus partidas, la racha y el historial guardados en este navegador. No se puede deshacer.</p>
        <div class="pila">
          <button class="btn btn--grande" id="btn-borrar" type="button">Borrar mi progreso</button>
          <a class="btn btn--sec" href="../">Volver al juego</a>
        </div>
      </section>
      <section class="pantalla pantalla--centro" id="hecho" hidden>
        <h2 class="kicker">Hecho</h2>
        <p role="status">Tu progreso se ha borrado. Volviendo al relicario…</p>
      </section>
    </main>
  </div>

  <script>
    document.getElementById('btn-borrar').addEventListener('click', function () {
      try { window.localStorage.removeItem('relicario:v1'); } catch (e) { /* sin almacenamiento */ }
      document.getElementById('pregunta').hidden = true;
      document.getElementById('hecho').hidden = false;
      setTimeout(function () { location.href = '../'; }, 1500);
    });
  </script>
</body>
</html>
