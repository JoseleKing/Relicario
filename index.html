    try {
      if (localStorage.getItem('almanaque:tema') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]').content = '#1C1712';
        document.querySelector('meta[name="color-scheme"]').content = 'dark';

  <!-- Estilos de la portada en línea: así se pinta bien antes de que cargue styles.css.

  <style>
    #portada {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 1rem;
      background: #F3EAD8;
      color: #2B2118;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    [data-theme="dark"] #portada { background: #1C1712; color: #ECE1C9; }
    #portada.oculta { opacity: 0; visibility: hidden; }
    .portada__logo { width: 8rem; height: 8rem; animation: asomar 0.5s ease-out both; }
    .portada__nombre {
      margin: 0;
      font-family: "IM Fell English SC", "IM Fell English", Georgia, serif;
      font-size: 2.6rem;
      letter-spacing: 0.04em;
      line-height: 1;
      animation: asomar 0.5s ease-out both;
    }
    @keyframes asomar { from { opacity: 0; transform: scale(0.9); } }
    @media (prefers-reduced-motion: reduce) {
      #portada, #portada * { animation: none; transition: none; }
    }
  </style>
